<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR — Open-World Crime</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10121a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The HUD lives on its own transparent canvas above the 3D view, so the
     menus, the wanted stars and the minimap always draw on top. Clicks pass
     straight through it to the game canvas below. */
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR: an open-world crime game. Walk the city, steal a car, outrun the police, run missions."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./src/three.min.js"></script>
<script src="./src/GLTFLoader.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
